name: Deploy Lenoz7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment artifact
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify production videos
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' videos < <(find public-site -type f -name '*.mp4' -print0)
          if [[ ${#videos[@]} -ne 7 ]]; then
            echo "Expected 7 production MP4 files, found ${#videos[@]}." >&2
            exit 1
          fi
          for video in "${videos[@]}"; do
            if head -c 64 "$video" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
              echo "Unresolved Git LFS pointer: $video" >&2
              exit 1
            fi
            test "$(stat -c%s "$video")" -gt 1024 || {
              echo "Production video is unexpectedly small: $video" >&2
              exit 1
            }
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
